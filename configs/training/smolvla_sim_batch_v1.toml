# SmolVLA action-expert training on the simulated batch dataset (configs/training/dataset.sim_batch_v1.toml),
# warm-started from the sort-depth-v2-10k run on the 35 real episodes (best.ckpt, step 4120), converted with
# scripts/training/ckpt_to_warm_start.py into artifacts/warm-start/sort-depth-v2-10k. The architecture still comes
# from lerobot/smolvla_base; normalisation statistics come from the simulated training split.
# Data parallel on 8 GPUs of one Modal container: effective batch 8 x 8 = 64. The 105k training frames make one
# epoch about 1,650 steps, so 3,750 steps run about 2.3 epochs (validation and best.ckpt twice), the same number of
# samples as 15k steps at batch 16. The learning rate follows the square root of the 4x larger batch, and warm-up
# shrinks with the shorter run; the cosine decay spans max_steps.
name = "smolvla-sim-batch-v1-warm-ddp8"
policy = "smolvla"
experimental = false
warm_start = "sort-depth-v2-10k"
devices = 8
num_workers = 4
batch_size = 8
max_steps = 3750
val_split = 0.1
split_seed = 4
precision = "bf16-mixed"
accumulate_grad_batches = 1

[model]
pretrained_name_or_path = "lerobot/smolvla_base"
optimizer_lr = 0.0002
scheduler_warmup_steps = 250
freeze_vision_encoder = true
train_expert_only = true
train_state_proj = true
compile_model = false
